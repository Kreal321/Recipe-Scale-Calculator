<div class="card shadow">
  <div class="card-body">
    <h5 class="card-title mb-4">Ingredients</h5>
    <ul class="list-group list-group-light mb-4">
      <li class="list-group-item fw-bold border-0 bg-light">
        <div class="row align-items-center text-center">
          <div class="col-4 text-start">Ingredient</div>
          <div class="col-4 col-md-2">Weight</div>
          <div class="col-4 col-md-2">Unit</div>
          <div class="col-2 d-none d-md-block">Price</div>
          <div class="col-2 d-none d-md-block">Unit</div>
          <div class="col-2">Scaled Weight ({{outputUnit}})</div>
        </div>
      </li>
      <li class="list-group-item py-2" *ngFor="let ingredient of recipe?.ingredients; let i = index" [ngClass]="{'bg-light': i % 2 === 0}">
        <app-ingredient-item [(ingredient)]="recipe!.ingredients[i]" (valueHasChanged)="valueChanged()"></app-ingredient-item>
        <span class="col-2">
          {{ getScaledWeight(ingredient) | number:'1.2-2' }}
        </span>
      </li>
    </ul>
    <div class="d-flex justify-content-center mt-3" >
      <button class="btn btn-success me-2">Calculate</button>
    </div>
  </div>
</div>

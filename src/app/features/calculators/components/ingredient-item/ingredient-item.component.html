<div class="row align-items-center text-center">
  <div class="col-4 text-start">{{ingredient?.name}}</div>
  <div class="col-4 col-md-2">
    <input type="text" class="form-control" [(ngModel)]="ingredient!.weight" (ngModelChange)="valueChanged($event)"/>
  </div>
  <div class="col-4 col-md-2">
    <app-unit-btn [(unit)]="ingredient!.weightUnit" (valueHasChanged)="valueChanged($event)"></app-unit-btn>
  </div>
  <div class="col-2 col-md-2">
    <input type="number" class="form-control" [(ngModel)]="ingredient!.price" (ngModelChange)="valueChanged($event)" placeholder="Price" min="0" step="any"/>
  </div>
  <div class="col-2 col-md-2">
    <app-unit-btn [(unit)]="ingredient!.priceUnit" (valueHasChanged)="valueChanged($event)"></app-unit-btn>
  </div>
</div>
